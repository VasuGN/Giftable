
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #263445;
        }

        form {
            display: grid;
            gap: 12px;
            margin-bottom: 30px;
        }

        input, select, button {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            cursor: pointer;
            border: none;
            color: white;
            background: #2563eb;
        }

        button:hover {
            opacity: 0.85;
        }

        .delete-btn {
            background: #dc2626;
        }

        .edit-btn {
            background: #16a34a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #263445;
            color: white;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        #message {
            margin-bottom: 15px;
            color: green;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 12px;
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Personal Expense Tracker</h1>

        <h2>Add / Update Expense</h2>

        <form id="expenseForm">

            <input type="text" id="title"
                placeholder="Expense Title" required>

            <input type="number" id="amount"
                placeholder="Amount" min="0.01"
                step="0.01" required>

            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>

            <input type="date" id="date" required>

            <button type="submit" id="submitBtn">
                Add Expense
            </button>

            <button type="button" id="cancelBtn"
                style="display:none; background:#64748b">
                Cancel Update
            </button>

        </form>

        <p id="message"></p>

        <h2>All Expenses</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="expenseList"></tbody>

        </table>

        <h3 id="totalAmount">Total: ₹0</h3>

    </div>

    <script>

        const API_URL = "/expenses";

        const expenseForm = document.getElementById("expenseForm");
        const expenseList = document.getElementById("expenseList");
        const message = document.getElementById("message");

        const titleInput = document.getElementById("title");
        const amountInput = document.getElementById("amount");
        const categoryInput = document.getElementById("category");
        const dateInput = document.getElementById("date");

        const submitBtn = document.getElementById("submitBtn");
        const cancelBtn = document.getElementById("cancelBtn");

        let editingId = null;


        // Get all expenses
        async function loadExpenses() {

            try {
                const response = await fetch(API_URL);

                const expenses = await response.json();

                expenseList.innerHTML = "";

                let total = 0;

                expenses.forEach(expense => {

                    total += expense.amount;

                    const row = document.createElement("tr");

                    const values = [
                        expense.id,
                        expense.title,
                        "₹" + expense.amount,
                        expense.category,
                        expense.date
                    ];

                    values.forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                    const actionCell = document.createElement("td");
                    const actions = document.createElement("div");
                    actions.className = "actions";

                    const editButton = document.createElement("button");
                    editButton.textContent = "Edit";
                    editButton.className = "edit-btn";
                    editButton.addEventListener("click", () => {
                        editExpense(expense);
                    });

                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete";
                    deleteButton.className = "delete-btn";
                    deleteButton.addEventListener("click", () => {
                        deleteExpense(expense.id);
                    });

                    actions.append(editButton, deleteButton);
                    actionCell.appendChild(actions);
                    row.appendChild(actionCell);

                    expenseList.appendChild(row);

                });

                document.getElementById("totalAmount").textContent =
                    "Total: ₹" + total.toFixed(2);

            } catch (error) {
                message.textContent = "Unable to load expenses.";
            }
        }


        // Add or update expense
        expenseForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const expense = {
                title: titleInput.value,
                amount: Number(amountInput.value),
                category: categoryInput.value,
                date: dateInput.value
            };

            let url = API_URL;
            let method = "POST";

            if (editingId !== null) {
                url = `${API_URL}/${editingId}`;
                method = "PUT";
            }

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(expense)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || "Request failed");
                }

                message.textContent = editingId !== null
                    ? "Expense updated successfully!"
                    : "Expense added successfully!";

                resetForm();

                loadExpenses();

            } catch (error) {
                message.textContent = error.message;
            }

        });


        // Edit expense
        function editExpense(expense) {

            editingId = expense.id;

            titleInput.value = expense.title;
            amountInput.value = expense.amount;
            categoryInput.value = expense.category;
            dateInput.value = expense.date;

            submitBtn.textContent = "Update Expense";
            cancelBtn.style.display = "block";

            message.textContent = "Editing expense ID: " + expense.id;
        }


        // Delete expense
        async function deleteExpense(id) {

            if (!confirm("Are you sure you want to delete this expense?")) {
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    throw new Error("Unable to delete expense.");
                }

                message.textContent = "Expense deleted successfully!";

                if (editingId === id) {
                    resetForm();
                }

                loadExpenses();

            } catch (error) {
                message.textContent = error.message;
            }
        }


        // Reset form
        function resetForm() {

            expenseForm.reset();

            editingId = null;

            submitBtn.textContent = "Add Expense";

            cancelBtn.style.display = "none";
        }


        // Cancel update
        cancelBtn.addEventListener("click", resetForm);


        // Load expenses when page opens
        loadExpenses();

    </script>

</body>

</html>
